# apps/worker/docker-compose.yml
#
# Pokretanje na Hetzner CX22, iz korena repoa:
#   docker compose -f apps/worker/docker-compose.yml up -d --build
#   docker compose -f apps/worker/docker-compose.yml logs -f
#
# Worker NEMA nijedan otvoren port i nijedan `ports:` unos ovde. On sam vuče
# posao iz `job_queue`; niko ga ne doziva. To uklanja Caddy, TLS i ceo inbound
# napadni vektor (00-kontekst §3).

services:
  worker:
    build:
      # Kontekst je koren monorepoa — Dockerfile kopira i packages/shared.
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped

    # ── ograničenja iz PRD-a §6 ────────────────────────────
    user: "1001:1001"
    read_only: true
    tmpfs:
      # Jedino mesto na koje proces sme da piše. Od F3 mu ni to zapravo ne treba
      # — brojač Google poziva je otišao u Postgres, pa nema `.cache/` fajla.
      # Ostaje zbog Node-ovih privremenih fajlova i budućeg Playwrighta.
      - /tmp:size=512M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 200

    env_file:
      # Nikad u sliku i nikad u repo. Fajl stoji samo na serveru, chmod 600.
      - ../../.env

    environment:
      NODE_ENV: production
      TZ: Europe/Belgrade
      # Dan i mesec budžeta se računaju u bazi po America/Los_Angeles, pa TZ ovde
      # utiče samo na vremenske oznake u logu.
      WORKER_CONCURRENCY: "3"

    # Log rotacija — bez ovoga json-file drajver puni disk dok ne pukne.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # Nema HTTP endpointa za health check, pa se proverava da proces živi.
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
