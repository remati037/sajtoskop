name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  provera:
    runs-on: ubuntu-latest

    # Build namerno ide sa lažnim tajnama. Poenta koraka nije da aplikacija radi,
    # nego da se dobije klijentski bundle koji se onda pretraži (P0-4).
    #
    # Vrednosti su čitljive rečenice, a ne nasumični nizovi, da ih gitleaks ne
    # prijavljuje kao tajne po entropiji.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-kljuc-koji-nije-pravi
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-kljuc-koji-nije-pravi
      CLERK_SECRET_KEY: sk_test_ci
      # Clerk dekodira publishable ključ da izvuče svoj domen, pa mora da bude
      # ispravnog oblika — ovo je base64 od "ci.clerk.accounts.dev$".
      # Publishable ključ je javan po dizajnu, a ovaj je uz to i izmišljen.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA== # gitleaks:allow

    # Sve akcije su na `node24` runtime-u. Node 20 je deprecatovan i runner ga
    # od sada forsira na 24 uz upozorenje — kad forsiranje prestane, workflow sa
    # starim akcijama puca. Verzije se pinuju po major-u, ne po SHA: ovo je javan
    # repo bez tajni u CI-u, pa je automatski patch važniji od zaključanog SHA.
    steps:
      - uses: actions/checkout@v7
        with:
          # Puna istorija, zbog `gitleaks` koraka na dnu. On skenira opseg
          # `<prvi commit u pushu>^..<poslednji>`, a podrazumevani plitak klon
          # (dubina 1) taj opseg nema — pa git javi „unknown revision" i ceo
          # posao padne. Sa jednim commitom po pushu se to ne vidi; prvi push sa
          # dva commita obori CI iako je kod ispravan.
          fetch-depth: 0

      # v6 je prva koja zvanično podržava pnpm 11 (koren `packageManager`).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # [Faza 6, 6.9] CVE-jevi u produkcijskim zavisnostima padaju pre deploy-a.
      # Playwright/Chromium renderuje nepoznat sadržaj — tu ažurnost zaista znači.
      - name: Audit produkcijskih zavisnosti
        run: pnpm audit --prod
        continue-on-error: true # informativno — pravi zid je Dependabot

      - name: Tipovi
        run: pnpm typecheck

      - name: Testovi
        run: pnpm test

      - name: Migracije
        run: pnpm check:sql

      - name: Build weba
        run: pnpm --filter @sajtoskop/web build

      # [Faza 7, 7.4] Garancija da Ugly Score heuristike ne procure u klijentski
      # bundle (SH1). Tree-shaking je dobar ali nije dokaz — grep nad buildanim
      # statikom jeste. `scoreSite` je najveći simbol te heuristike.
      - name: Težine van bundle-a
        run: |
          if grep -rq "scoreSite\|no_viewport" apps/web/.next/static; then
            echo "Ugly Score heuristike su u klijentskom bundle-u!" && exit 1
          fi
          echo "bundle čist — heuristike nisu u static-u"

      - name: Lint
        run: pnpm --filter @sajtoskop/web lint

      - name: Tajne u bundle-u
        run: pnpm check:secrets

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
