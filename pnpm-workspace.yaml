packages:
  - "apps/*"
  - "packages/*"

# tsx nosi esbuild; njegov postinstall raspakuje binarni fajl za ovu platformu.
allowBuilds:
  esbuild: true
  # Next.js koristi sharp za optimizaciju slika; postinstall raspakuje binarni fajl.
  sharp: true
  # eslint koristi unrs-resolver (native); build je bezbedan.
  unrs-resolver: true
  # Tranzitivno uz @sentry/nextjs. Postinstall skida binarni alat za upload
  # sourcemap-a, koji ide samo uz `withSentryConfig` — a njega namerno nema
  # (Sentry je samo serverski, v. apps/web/src/lib/sentry-opcije.ts).
  '@sentry/cli': false

minimumReleaseAgeExclude:
  - '@clerk/backend@3.15.1'
  - '@clerk/nextjs@7.6.5'
  - '@clerk/react@6.12.11'
  - '@clerk/shared@4.26.0'
